[project]
name = "project"
version = "0.1.0"
description = "Shadow-mode watcher that monitors in-transit loads and recommends ops actions"
readme = "README.md"
authors = [
    { name = "iguptagit", email = "150552432+iguptagit@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.0",
    "dataclasses>=0.8",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
watcher = "project.main:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
